<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Предложка — Рифмарий</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=6" />
  <link rel="stylesheet" href="auth.css?v=2" />
  <link rel="stylesheet" href="support.css?v=1" />
</head>
<body>
  <div class="bg-layer" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="grain"></div>
  </div>

  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Рифмарий — на главную">
      <span class="brand-mark" aria-hidden="true">◇</span>
      <span class="brand-name">Рифмарий</span>
    </a>
    <nav class="top-nav" aria-label="Разделы">
      <button type="button" class="nav-pill" data-go="index.html">Рифмы</button>
      <button type="button" class="nav-pill" data-go="contest.html">Стихи</button>
      <button type="button" class="nav-pill is-current" data-go="ideas.html" aria-current="page">Идеи</button>
      <button type="button" class="nav-pill" data-go="support.html">Поддержка</button>
    </nav>
  </header>

  <main class="support-main">
    <section class="support-hero">
      <p class="brand-hero">Предложка</p>
      <h1>Улучшения проекта</h1>
      <p class="lede">Предложите функцию, правку или идею для Рифмария. Нужна помощь по аккаунту? <a href="support.html">Напишите в поддержку</a>.</p>
    </section>

    <section class="support-panel">
      <form class="idea-form" id="idea-form">
        <label>
          <span>Имя или псевдоним</span>
          <input id="idea-name" type="text" maxlength="40" placeholder="Как к вам обращаться" required />
        </label>
        <label>
          <span>Ваша идея</span>
          <textarea id="idea-text" rows="7" maxlength="2000" placeholder="Что добавить или изменить…" required></textarea>
        </label>
        <div class="idea-form-bar">
          <button type="submit" class="btn-primary">Отправить идею</button>
          <p class="form-status" id="idea-status" role="status"></p>
        </div>
      </form>
    </section>

    <section class="support-panel" id="ideas-admin" hidden>
      <h2>Входящие идеи</h2>
      <ul class="ideas-list" id="ideas-list"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <p><span class="brand-name">Рифмарий</span> — настольный помощник для стиха.</p>
  </footer>

  <script src="auth.js?v=5"></script>
  <script src="ideas.js?v=1"></script>
</body>
</html>
