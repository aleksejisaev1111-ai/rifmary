<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Автор — Рифмарий</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=6" />
  <link rel="stylesheet" href="auth.css?v=2" />
  <link rel="stylesheet" href="profile.css?v=5" />
</head>
<body>
  <div class="bg-layer" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="grain"></div>
  </div>

  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Рифмарий — на главную">
      <span class="brand-mark" aria-hidden="true">◇</span>
      <span class="brand-name">Рифмарий</span>
    </a>
    <nav class="top-nav" aria-label="Разделы">
      <button type="button" class="nav-pill" data-go="index.html">Рифмы</button>
      <button type="button" class="nav-pill" data-go="contest.html">Стихи</button>
      <button type="button" class="nav-pill" data-go="ideas.html">Идеи</button>
      <button type="button" class="nav-pill" data-go="support.html">Поддержка</button>
    </nav>
  </header>

  <main class="profile-main">
    <section class="profile-hero">
      <p class="brand-hero">Автор</p>
      <h1 id="author-title">Загрузка…</h1>
      <p class="lede" id="author-lede">Публичный профиль на Рифмарии.</p>
      <div class="profile-actions" id="author-actions" hidden>
        <button type="button" class="btn-primary" id="follow-btn">Подписаться</button>
        <button type="button" class="btn-ghost" id="export-author-poems">Скачать стихи .txt</button>
        <button type="button" class="btn-ghost" id="warn-btn" hidden>Предупреждение</button>
        <button type="button" class="btn-ghost" id="ban-btn" hidden>Забанить</button>
        <button type="button" class="btn-ghost" id="unban-btn" hidden>Разбанить</button>
        <button type="button" class="btn-ghost" id="promote-btn" hidden>Сделать модератором</button>
        <button type="button" class="btn-ghost" id="demote-btn" hidden>Снять модератора</button>
      </div>
      <p class="mod-note" id="author-mod-note" hidden></p>
    </section>

    <section class="profile-panel" id="author-body">
      <div class="profile-stats" aria-label="Статистика">
        <article class="stat-tile">
          <p class="stat-label">Стихов</p>
          <p class="stat-value" id="author-poems">0</p>
        </article>
        <article class="stat-tile">
          <p class="stat-label">Рейтинг</p>
          <p class="stat-value" id="author-rank">—</p>
          <p class="stat-note" id="author-votes">0 голосов</p>
        </article>
        <article class="stat-tile">
          <p class="stat-label">Возраст</p>
          <p class="stat-value" id="author-age">—</p>
        </article>
      </div>

      <div class="profile-poems">
        <h2>Стихи автора</h2>
        <ul class="profile-poem-list" id="author-poem-list"></ul>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p><span class="brand-name">Рифмарий</span> — настольный помощник для стиха.</p>
  </footer>

  <script src="auth.js?v=5"></script>
  <script src="author.js?v=4"></script>
</body>
</html>
